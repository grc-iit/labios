# Single-host reference deployment. The localhost ports and unauthenticated
# development credentials are unsafe for production; see docs/deployment.md.
services:
  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:4222:4222" # UNSAFE development client endpoint (no auth/TLS)
      - "127.0.0.1:8222:8222" # UNSAFE development monitoring endpoint
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:8222/healthz | grep -q ok"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    command: ["--logtostderr", "--dir=/data", "--dbfilename=labios"]
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:6379:6379" # UNSAFE development endpoint (no password/TLS)
    volumes:
      - dragonfly-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  # Development fixture representing a user's external Redis backend.
  redis-kv:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    stop_grace_period: 15s
    ports:
      - "127.0.0.1:6380:6379" # UNSAFE development fixture (no password/TLS)
    volumes:
      - redis-kv-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  manager:
    build: { context: ., target: manager }
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      nats: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      LABIOS_NATS_URL: "nats://nats:4222"
      LABIOS_REDIS_HOST: "redis"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/labios-ready && kill -0 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  dispatcher:
    build: { context: ., target: dispatcher }
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      nats: { condition: service_healthy }
      redis: { condition: service_healthy }
      manager: { condition: service_healthy }
    environment:
      LABIOS_NATS_URL: "nats://nats:4222"
      LABIOS_REDIS_HOST: "redis"
      LABIOS_SCHEDULER_POLICY: "${LABIOS_SCHEDULER_POLICY:-round-robin}"
      LABIOS_SCHEDULER_PROFILE: "${LABIOS_SCHEDULER_PROFILE:-}"
      LABIOS_DISPATCHER_BATCH_TIMEOUT_MS: "${LABIOS_DISPATCHER_BATCH_TIMEOUT_MS:-100}"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/labios-ready && kill -0 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  worker-1:
    build: { context: ., target: worker }
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      nats: { condition: service_healthy }
      redis: { condition: service_healthy }
      redis-kv: { condition: service_healthy }
      manager: { condition: service_healthy }
    environment:
      LABIOS_NATS_URL: "nats://nats:4222"
      LABIOS_REDIS_HOST: "redis"
      LABIOS_KV_HOST: "redis-kv"
      LABIOS_KV_PORT: "6379"
      LABIOS_WORKER_ID: "1"
      LABIOS_WORKER_TIER: "1"
      LABIOS_WORKER_SPEED: "5"
      LABIOS_WORKER_ENERGY: "1"
      LABIOS_WORKER_CAPACITY: "${LABIOS_WORKER_1_CAPACITY:-10GB}"
      LABIOS_WORKER_IDLE_TIMEOUT_MS: "86400000"
      LABIOS_TEST_EXECUTION_DELAY_MS: "${LABIOS_TEST_EXECUTION_DELAY_MS:-0}"
    volumes:
      - worker-data:/labios/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/labios-ready && kill -0 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  worker-2:
    build: { context: ., target: worker }
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      nats: { condition: service_healthy }
      redis: { condition: service_healthy }
      redis-kv: { condition: service_healthy }
      manager: { condition: service_healthy }
    environment:
      LABIOS_NATS_URL: "nats://nats:4222"
      LABIOS_REDIS_HOST: "redis"
      LABIOS_KV_HOST: "redis-kv"
      LABIOS_KV_PORT: "6379"
      LABIOS_WORKER_ID: "2"
      LABIOS_WORKER_TIER: "1"
      LABIOS_WORKER_SPEED: "3"
      LABIOS_WORKER_ENERGY: "3"
      LABIOS_WORKER_CAPACITY: "${LABIOS_WORKER_2_CAPACITY:-50GB}"
      LABIOS_WORKER_IDLE_TIMEOUT_MS: "86400000"
      LABIOS_TEST_EXECUTION_DELAY_MS: "${LABIOS_TEST_EXECUTION_DELAY_MS:-0}"
    volumes:
      - worker-data:/labios/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/labios-ready && kill -0 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  worker-3:
    build: { context: ., target: worker }
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      nats: { condition: service_healthy }
      redis: { condition: service_healthy }
      redis-kv: { condition: service_healthy }
      manager: { condition: service_healthy }
    environment:
      LABIOS_NATS_URL: "nats://nats:4222"
      LABIOS_REDIS_HOST: "redis"
      LABIOS_KV_HOST: "redis-kv"
      LABIOS_KV_PORT: "6379"
      LABIOS_WORKER_ID: "3"
      LABIOS_WORKER_TIER: "1"
      LABIOS_WORKER_SPEED: "1"
      LABIOS_WORKER_ENERGY: "5"
      LABIOS_WORKER_CAPACITY: "${LABIOS_WORKER_3_CAPACITY:-200GB}"
      LABIOS_WORKER_IDLE_TIMEOUT_MS: "86400000"
      LABIOS_TEST_EXECUTION_DELAY_MS: "${LABIOS_TEST_EXECUTION_DELAY_MS:-0}"
    volumes:
      - worker-data:/labios/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/labios-ready && kill -0 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  mcp:
    build: { context: ./mcp }
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      nats: { condition: service_healthy }
      redis: { condition: service_healthy }
      dispatcher: { condition: service_healthy }
    environment:
      LABIOS_REDIS_HOST: "redis"
      LABIOS_REDIS_PORT: "6379"
      LABIOS_NATS_URL: "nats://nats:4222"
    volumes:
      - worker-data:/labios/data:ro
    stdin_open: true
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; a=socket.create_connection(('redis',6379),2); a.close(); b=socket.create_connection(('nats',4222),2); b.close()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot tooling image. It is intentionally not started by `compose up`.
  test:
    profiles: ["test"]
    build: { context: ., target: test }
    restart: "no"
    depends_on:
      dispatcher: { condition: service_healthy }
      worker-1: { condition: service_healthy }
      worker-2: { condition: service_healthy }
      worker-3: { condition: service_healthy }
      manager: { condition: service_healthy }
    environment:
      LABIOS_NATS_URL: "nats://nats:4222"
      LABIOS_REDIS_HOST: "redis"
      LABIOS_KV_HOST: "redis-kv"
      LABIOS_KV_PORT: "6379"
    healthcheck:
      test: ["CMD-SHELL", "command -v labios-smoke-test >/dev/null && command -v labios-demo >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 1s

volumes:
  nats-data:
  dragonfly-data:
  redis-kv-data:
  worker-data:
