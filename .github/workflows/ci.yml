name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake git libssl-dev python3-dev python3-pip
          python3 -m pip install flatbuffers==24.3.25 pytest==8.3.5

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build build/ci -j"$(nproc)"

      - name: Run unit tests
        run: ctest --test-dir build/ci --output-on-failure -L unit

      - name: Run hermetic Python SDK tests
        env:
          PYTHONPATH: build/ci/python
        run: python3 -m pytest -q tests/python -m "not live"

  compose-golden-path:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build clean reference topology
        run: docker compose --profile test build

      - name: Start and wait for daemon readiness
        run: docker compose up -d --wait

      - name: Prove every daemon is healthy
        run: |
          for service in nats redis redis-kv manager dispatcher worker-1 worker-2 worker-3 mcp; do
            container="$(docker compose ps -q "$service")"
            test -n "$container"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          done
          curl -fsS http://127.0.0.1:8222/healthz
          test "$(docker compose exec -T redis redis-cli ping)" = PONG

      - name: Run documented verified-I/O demo
        run: docker compose exec -T dispatcher labios-demo

      - name: Verify shared file and SQLite visibility
        run: docker compose run --rm test labios-data-path-test "[deployment]"

      - name: Run Python public-API live tests and golden example
        run: |
          docker compose run --rm -e LABIOS_PYTHON_LIVE=1 test \
            python3 -m pytest -q /opt/labios/tests/python -m live
          docker compose run --rm test \
            python3 /opt/labios/examples/python/golden.py

      - name: Prove round-robin reached every worker
        run: |
          for service in worker-1 worker-2 worker-3; do
            docker compose logs "$service" | grep -q 'WRITE'
            docker compose logs "$service" | grep -q 'READ'
          done

      - name: Restart durable plumbing without losing state
        run: |
          docker compose exec -T redis redis-cli set labios:deployment:probe durable
          docker compose exec -T redis redis-cli save
          before_messages="$(curl -fsS 'http://127.0.0.1:8222/jsz?streams=true' | jq -r '.messages')"
          test "$before_messages" -gt 0
          docker compose restart nats redis
          docker compose restart manager dispatcher worker-1 worker-2 worker-3 mcp
          docker compose up -d --wait
          test "$(docker compose exec -T redis redis-cli get labios:deployment:probe)" = durable
          after_messages="$(curl -fsS 'http://127.0.0.1:8222/jsz?streams=true' | jq -r '.messages')"
          test "$after_messages" -ge "$before_messages"
          curl -fsS 'http://127.0.0.1:8222/jsz?streams=true' | grep -q LABIOS_LABELS
          docker compose exec -T dispatcher labios-demo

      - name: Capture service state
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color > compose.log

      - name: Upload Compose log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-golden-path-log
          path: compose.log

      - name: Teardown
        if: always()
        run: docker compose --profile test down -v --remove-orphans
